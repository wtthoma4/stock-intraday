# Nginx serves the built web application and sends API requests to the API container.
# The page and the API have the same origin, so the browser does not need CORS.

server {
    listen 8080;
    root /usr/share/nginx/html;
    # Do not show the Nginx version in error pages and headers.
    server_tokens off;

    # Compress text files. The JavaScript file becomes about 3 times smaller.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers: this file sets them only for the page and its files, in the locations below.
    # The API sends its own security headers, so the /api/ location adds none. Two policies on one reply are difficult to understand.
    # Nginx does not copy `add_header` from the server block into a location that has its own `add_header`,
    # so each location lists all of its headers.

    # Send /api/... to the API container without a change to the path.
    # `proxy_pass` without a path keeps the encoded symbol, for example %5EGSPC, as the browser sent it.
    location /api/ {
        proxy_pass http://api:5080;
        proxy_set_header Host $host;
        # Replace the header that the client sent with the real client address. A client can write any address
        # in X-Forwarded-For. The API trusts one proxy (TRUST_PROXY=1), so it uses this address for the rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a hash of the content in each file name in /assets/, so a browser can keep these files for a long time.
    # One Cache-Control header with all values. (`expires` would add a second Cache-Control header.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # All other paths give the page. The page reads the symbol from the URL.
    location / {
        try_files $uri /index.html;
        # The browser must get a new index.html after a deployment, because it names the new asset files.
        # Recharts uses inline styles, so the content security policy permits them.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    }
}
